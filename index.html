function drawLevelIntro(){var lvl=LEVELS[currentLevel];introTimer+=0.016;var grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,lvl.bgColor1);grad.addColorStop(1,lvl.bgColor2);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);var scale=Math.min(1,introTimer*2);ctx.save();ctx.translate(W/2,180);ctx.scale(scale,scale);ctx.fillStyle=lvl.accentColor;ctx.font='bold 72px "Segoe UI",sans-serif';ctx.textAlign="center";ctx.fillText("LEVEL "+(currentLevel+1),0,0);ctx.restore();if(introTimer>0.3){var a=Math.min(1,(introTimer-0.3)*3);ctx.globalAlpha=a;ctx.fillStyle="#fff";ctx.font='bold 48px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign="center";ctx.fillText(lvl.name,W/2,280);ctx.fillStyle=lvl.accentColor;ctx.font='bold 28px "Segoe UI",sans-serif';ctx.fillText(lvl.nameEn,W/2,325);ctx.globalAlpha=1}if(introTimer>0.8){var a=Math.min(1,(introTimer-0.8)*2);ctx.globalAlpha=a;ctx.fillStyle="#ccc";ctx.font='20px "PingFang SC",sans-serif';ctx.textAlign="center";ctx.fillText(lvl.desc,W/2,400);ctx.fillStyle="#999";ctx.font='16px "Segoe UI",sans-serif';ctx.fillText(lvl.descEn,W/2,435);ctx.globalAlpha=1}if(introTimer>1.5){var blink=0.5+Math.sin(introTimer*4)*0.5;ctx.globalAlpha=blink;ctx.fillStyle="#fff";ctx.font='18px "PingFang SC",sans-serif';ctx.textAlign="center";ctx.fillText("\u6309\u4EFB\u610F\u952E\u5F00\u59CB\u672C\u5173",W/2,530);ctx.globalAlpha=1}}
function drawLevelComplete(){completeTimer+=0.016;var lvl=LEVELS[currentLevel];drawBackground();drawPlatforms();collectibles.forEach(drawCollectible);drawGoal();if(player)drawChar(player.x-camera.x,player.y-camera.y,player.w,player.h,player.facing,player.animFrame,0,selectedCostume,0,0);ctx.fillStyle="rgba(0,0,0,0.6)";ctx.fillRect(0,0,W,H);if(flashAlpha>0){ctx.globalAlpha=flashAlpha;ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;flashAlpha-=0.03}var pw=500,ph=320,px=(W-pw)/2,py=(H-ph)/2;ctx.fillStyle="rgba(20,20,60,0.95)";ctx.strokeStyle=lvl.accentColor;ctx.lineWidth=3;rrect(px,py,pw,ph,20);ctx.fillStyle="#FFD700";ctx.font='bold 36px "PingFang SC",sans-serif';ctx.textAlign="center";ctx.fillText("\u5173\u5361\u5B8C\u6210!",W/2,py+60);ctx.fillStyle=lvl.accentColor;ctx.font='bold 24px "Segoe UI",sans-serif';ctx.fillText(lvl.name+" - "+lvl.nameEn,W/2,py+100);ctx.fillStyle="#fff";ctx.font='20px "Segoe UI",sans-serif';ctx.fillText("\u6536\u96C6: "+coinsCollected+"/"+coinsInLevel,W/2,py+155);ctx.fillText("\u5F97\u5206: "+score,W/2,py+190);ctx.fillText("\u751F\u547D: "+lives,W/2,py+225);if(completeTimer>1.5){var blink=0.5+Math.sin(completeTimer*4)*0.5;ctx.globalAlpha=blink;ctx.fillStyle="#FFD700";ctx.font='18px "PingFang SC",sans-serif';ctx.fillText("\u6309\u4EFB\u610F\u952E\u7EE7\u7EED",W/2,py+280);ctx.globalAlpha=1}}
function drawVictory(){titleAnim+=0.016;var cols2=["#FFD700","#FF6347","#3CB371","#6495ED","#FF69B4"];var hue=(titleAnim*30)%360,grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,"hsl("+hue+",50%,15%)");grad.addColorStop(0.5,"hsl("+((hue+60)%360)+",50%,20%)");grad.addColorStop(1,"hsl("+((hue+120)%360)+",50%,15%)");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);if(Math.random()<0.3){spawnParticles(Math.random()*W,Math.random()*H*0.5,cols2[Math.floor(Math.random()*cols2.length)],3)}if(Math.random()<0.15){var fx=Math.random()*W,fy=Math.random()*H*0.4;for(var i=0;i<20;i++)particles.push(new Particle(fx,fy,cols2[Math.floor(Math.random()*cols2.length)],(Math.random()-0.5)*8,(Math.random()-0.5)*8,0.8+Math.random()*0.5,2+Math.random()*3))}particles.forEach(function(p){p.update();p.draw(ctx)});particles=particles.filter(function(p){return p.life>0});stars.forEach(function(s){s.tw+=0.05;ctx.globalAlpha=0.5+Math.sin(s.tw)*0.4;ctx.fillStyle="#FFD700";ctx.beginPath();ctx.arc(s.x%W,s.y,s.size*0.7+0.5,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;var bounce=Math.abs(Math.sin(titleAnim*3))*15;ctx.shadowColor="#FFD700";ctx.shadowBlur=15;ctx.fillStyle="#FFD700";ctx.font='bold 56px "PingFang SC",sans-serif';ctx.textAlign="center";ctx.fillText("\u606D\u559C\u901A\u5173!",W/2,160-bounce);ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.font='bold 28px "Segoe UI",sans-serif';ctx.fillText(playerName?playerName+"\uFF0C\u4F60\u592A\u68D2\u4E86!":"Congratulations!",W/2,210);var vals=[{name:"\u5BA2\u6237\u81F3\u4E0A",en:"Customer First",color:"#FFD700"},{name:"\u4EE5\u4EBA\u4E3A\u672C",en:"People Centric",color:"#3CB371"},{name:"\u5766\u8BDA\u6B63\u76F4",en:"Integrity & Transparency",color:"#6495ED"},{name:"\u81EA\u9A71\u5353\u8D8A",en:"Ownership & Excellence",color:"#FF6347"}];vals.forEach(function(v,i){var y=290+i*55,slide=Math.min(1,Math.max(0,titleAnim-i*0.3)*2);ctx.globalAlpha=slide;ctx.fillStyle=v.color+"44";rrect(W/2-200,y-20,400,42,10);ctx.fillStyle=v.color;ctx.font='bold 22px "PingFang SC",sans-serif';ctx.textAlign="center";ctx.fillText(v.name,W/2-20,y+6);ctx.fillStyle="#bbb";ctx.font='14px "Segoe UI",sans-serif';ctx.fillText(v.en,W/2+100,y+6);ctx.globalAlpha=1});ctx.fillStyle="#FFD700";ctx.font='bold 32px "Segoe UI",sans-serif';ctx.textAlign="center";ctx.fillText("\u603B\u5206: "+score,W/2,530);var blink=0.5+Math.sin(titleAnim*4)*0.5;ctx.globalAlpha=blink;ctx.fillStyle="#fff";ctx.font='18px "PingFang SC",sans-serif';ctx.fillText("\u6309\u4EFB\u610F\u952E\u91CD\u65B0\u5F00\u59CB",W/2,585);ctx.globalAlpha=1}
function groundYAt(wx){var gy=1e9;platforms.forEach(function(p){if(wx>=p.x&&wx<p.x+p.w){var hasAbove=platforms.some(function(pp){return pp.x===p.x&&pp.y===p.y-TILE});if(!hasAbove)gy=Math.min(gy,p.y)}});return gy===1e9?null:gy}
function drawParcel(px,py,scale,tilt){ctx.save();ctx.translate(px,py);ctx.rotate(tilt||0);ctx.scale(scale,scale);ctx.shadowColor="rgba(0,0,0,.28)";ctx.shadowBlur=5;var g=ctx.createLinearGradient(-18,-24,18,8);g.addColorStop(0,"#F2C58D");g.addColorStop(1,"#C98948");ctx.fillStyle=g;rrect(-18,-24,36,24,3);ctx.shadowBlur=0;ctx.fillStyle="#FF6B00";ctx.fillRect(-18,-6,36,5);ctx.fillStyle="#9A5727";ctx.fillRect(-2,-24,4,24);ctx.fillStyle="#fff";ctx.font="bold 7px sans-serif";ctx.textAlign="center";ctx.fillText("GOFO",8,-10);ctx.restore()}
function drawLogisticsScene(){var maxX=LEVELS[currentLevel].map[0].length*TILE;for(var tx=720;tx<maxX;tx+=1320){var ty=groundYAt(tx);if(ty!==null&&gofoTruck.complete){var sx=tx-camera.x;if(sx>-260&&sx<W+260){ctx.save();ctx.globalAlpha=.72;ctx.drawImage(gofoTruck,sx-115,ty-camera.y-118,230,118);ctx.restore()}}}for(var bx=300;bx<maxX;bx+=360){var by=groundYAt(bx);if(by!==null){var screenX=bx-camera.x;if(screenX>-60&&screenX<W+60){drawParcel(screenX,by-camera.y,1+(bx%3)*.06,Math.sin(bx)*.035);if((bx/360)%3===2)drawParcel(screenX+25,by-camera.y,.72,-.08)}}}}
var drawPlatformsBase=drawPlatforms;drawPlatforms=function(){drawPlatformsBase();drawLogisticsScene()};
var lastTime=0;
function gameLoop(time){var dt=Math.min((time-lastTime)/1000,0.05);lastTime=time;var shaking=shakeTimer>0;if(shaking){shakeTimer-=dt;if(shakeTimer<0)shakeTimer=0;ctx.save();ctx.translate((Math.random()-0.5)*shakeIntensity,(Math.random()-0.5)*shakeIntensity)}switch(gameState){case"title":drawTitle();break;case"costume":drawCostumeSelect();break;case"intro":drawLevelIntro();break;case"playing":levelTime+=dt;if(levelTime>=LEVEL_TIME_LIMIT){lives--;if(lives<=0){gameState="quiz";showValueQuiz();sfxGameOver();stopBGM()}else{loadLevel(currentLevel)}break}updatePlayer(dt);updateEnemies(dt);updateCamera();particles.forEach(function(p){p.update()});particles=particles.filter(function(p){return p.life>0});if(scoreAnimTimer>0)scoreAnimTimer-=dt;drawBackground();drawPlatforms();collectibles.forEach(drawCollectible);enemies.forEach(drawEnemy);drawGoal();if(player&&player.grounded&&Math.abs(player.vx)>2&&Math.random()<0.3)spawnParticles(player.x+player.w/2,player.y+player.h,"#aaa",1);if(player)drawChar(player.x-camera.x,player.y-camera.y,player.w,player.h,player.facing,player.animFrame,player.invincible,selectedCostume,player.attacking,player.dodging);particles.forEach(function(p){p.draw(ctx)});drawAttackFX();drawEnergyRings();drawDmgNums();drawHUD();drawMinimap();break;case"levelComplete":drawLevelComplete();particles.forEach(function(p){p.update();p.draw(ctx)});particles=particles.filter(function(p){return p.life>0});break;case"quiz":drawBackground();drawPlatforms();break;case"victory":drawVictory();break}if(shaking)ctx.restore();requestAnimationFrame(gameLoop)}
function handleMenuInput(){switch(gameState){case"title":showNameOverlay();break;case"costume":gameState="intro";currentLevel=0;score=0;lives=3;introTimer=0;loadLevel(0);playBGMTrack("level0");break;case"intro":if(introTimer>1)gameState="playing";break;case"levelComplete":if(completeTimer>1){currentLevel++;if(currentLevel>=LEVELS.length){gameState="victory";titleAnim=0;sfxWin();playBGMTrack("victory")}else if(currentLevel===3){stopBGM();showQuiz()}else{gameState="intro";introTimer=0;loadLevel(currentLevel);playBGMTrack("level"+currentLevel)}}break;case"victory":gameState="title";titleAnim=0;stopBGM();bgmCurrentTrack="";playBGMTrack("title");break}}
document.addEventListener("keydown",function(e){if(gameState==="costume"){if(e.code==="ArrowLeft"){selectedCostume=(selectedCostume-1+COSTUMES.length)%COSTUMES.length;sfxJump()}else if(e.code==="ArrowRight"){selectedCostume=(selectedCostume+1)%COSTUMES.length;sfxJump()}else if(e.code>="Digit1"&&e.code<="Digit5"){selectedCostume=parseInt(e.code[5])-1;if(selectedCostume>=COSTUMES.length)selectedCostume=COSTUMES.length-1;sfxCollect()}else if(e.code==="Space"||e.code==="Enter"){handleMenuInput();sfxCollect()}}});
canvas.addEventListener("click",function(e){if(gameState==="costume"){var rect=canvas.getBoundingClientRect(),scX=W/rect.width,scY=H/rect.height,mx2=(e.clientX-rect.left)*scX,my2=(e.clientY-rect.top)*scY,cardW=150,cardH=260,gap=20,totalW=COSTUMES.length*(cardW+gap)-gap,startX=(W-totalW)/2;COSTUMES.forEach(function(c,i){var x=startX+i*(cardW+gap),y=120;if(mx2>=x&&mx2<=x+cardW&&my2>=y&&my2<=y+cardH){selectedCostume=i;sfxCollect()}});if(my2>400)handleMenuInput()}});
requestAnimationFrame(gameLoop);
</script>
